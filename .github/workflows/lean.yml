name: Lean verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - name: Check out the exact source snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: "false"
      - name: Free disk on the disposable hosted runner
        run: |
          set -Eeuo pipefail
          if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force > /dev/null || true
          fi
          df -h .
          available_kib="$(df -Pk . | awk 'NR==2 {print $4}')"
          test "$available_kib" -ge 20971520
      - name: Source structure, integrity, and metadata
        run: |
          python3 -m pip install jsonschema==4.25.1
          python3 scripts/validate-metadata.py
          python3 scripts/check-release.py
      - name: Set up pinned Lean and canonical Mathlib cache
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Add memory headroom on the disposable hosted runner
        run: |
          set -Eeuo pipefail
          if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]; then
            steklov_available_kib=$(df -Pk . | awk 'NR==2 {print $4}')
            steklov_swap_gib=$((steklov_available_kib / 1048576 - 12))
            if (( steklov_swap_gib > 8 )); then steklov_swap_gib=8; fi
            if (( steklov_swap_gib > 0 )); then
              steklov_swap_path="${RUNNER_TEMP:?}/steklov-build.swap"
              test ! -e "$steklov_swap_path"
              sudo fallocate -l "${steklov_swap_gib}G" "$steklov_swap_path"
              sudo chmod 600 "$steklov_swap_path"
              sudo mkswap "$steklov_swap_path"
              sudo swapon "$steklov_swap_path"
            fi
          fi
          free -h
          df -h .
      - name: Record environment
        run: |
          mkdir -p verification/current-ci
          {
            git rev-parse HEAD
            git rev-parse HEAD^{tree}
            lean --version
            sha256sum lean-toolchain lake-manifest.json comparator.json
            echo 'project_build_cache_restored=false; canonical Mathlib cache allowed'
            free -h
            df -h .
          } > verification/current-ci/environment.txt
      - name: Build every advertised module and both submission entries from fresh project source
        run: |
          set -o pipefail
          test ! -d .lake/build/lib/lean/RequestProject
          (
            while true; do
              {
                date -u '+resource_snapshot=%Y-%m-%dT%H:%M:%SZ'
                free -m
                ps -C lean,lake -o pid,comm,etime,pcpu,pmem,rss --no-headers || true
                df -h .
              } | tee -a verification/current-ci/build-resources.log
              sleep 60
            done
          ) &
          steklov_monitor_pid=$!
          trap 'kill "$steklov_monitor_pid" 2>/dev/null || true' EXIT
          /usr/bin/time -v nice -n 10 lake build 2>&1 | tee verification/current-ci/build.log
      - name: Proof/type contracts and transitive axiom inventory
        run: |
          set -o pipefail
          python3 scripts/audit.py 2>&1 | tee verification/current-ci/axiom-audit.log
          cp .lake/audit/axioms.json verification/current-ci/axioms.json
      - name: Ensure verification preserved pinned source
        run: git diff --exit-code
      - name: Save project build artifacts
        if: ${{ !cancelled() }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: lean435-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.event.pull_request.head.sha || github.sha }}
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean435-build-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: verification/current-ci/
          if-no-files-found: ignore

