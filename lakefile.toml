name = "RequestProject"
version = "1.1.0"
defaultTargets = ["RequestProject", "Challenge", "Solution"]
# Bound each compiler process; this resource setting does not affect build traces.
weakLeanArgs = ["-j2"]

[leanOptions]
backward.isDefEq.respectTransparency = false
backward.defeqAttrib.useBackward = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
