{
  "name": "Checkpointed required Comparator",
  "description": "Preserve partial diagnostics while the unmodified sandboxed checker runs.",
  "runs": {
    "using": "composite",
    "steps": [
      {
        "name": "Start the unchanged required sandboxed Comparator",
        "id": "launch",
        "shell": "bash",
        "run": "set -Eeuo pipefail\nmkdir -p verification/current-ci\ntest ! -e verification/current-ci/required-replay.exit\necho 'STEKLOV_REPLAY_COMPLETE=false' >> \"$GITHUB_ENV\"\nnohup bash \"$GITHUB_ACTION_PATH/driver.sh\" < /dev/null > verification/current-ci/required-driver.log 2>&1 &\necho \"$!\" > verification/current-ci/required-replay.pid\n"
      },
      {
        "name": "Wait up to 20 minutes for required replay (1/18)",
        "id": "wait_01",
        "if": "steps.launch.outcome == 'success' && env.STEKLOV_REPLAY_COMPLETE != 'true'",
        "shell": "bash",
        "run": "bash \"$GITHUB_ACTION_PATH/poll.sh\""
      },
      {
        "name": "Preserve partial replay diagnostics (1/18)",
        "if": "always() && steps.wait_01.outcome != 'skipped'",
        "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
        "continue-on-error": true,
        "with": {
          "name": "lean435-replay-checkpoint-01-${{ github.event.pull_request.head.sha || github.sha }}",
          "path": "verification/current-ci/",
          "if-no-files-found": "error",
          "retention-days": 14
        }
      },
      {
        "name": "Wait up to 20 minutes for required replay (2/18)",
        "id": "wait_02",
        "if": "steps.launch.outcome == 'success' && env.STEKLOV_REPLAY_COMPLETE != 'true'",
